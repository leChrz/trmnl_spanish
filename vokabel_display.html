<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRMNL Spanish Mnemonic</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&family=Roboto+Slab:wght@400;700&display=swap');

        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --gray-light: #e0e0e0;
            --gray-dark: #555555;
        }

        body {
            margin: 0;
            padding: 0;
            width: 800px;
            height: 480px;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            overflow: hidden;
            display: flex;
        }

        /* Linke Hälfte: Das Bild */
        .image-container {
            width: 400px;
            height: 480px;
            background-color: #000; /* Platzhalter */
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Rechte Hälfte: Der Inhalt */
        .content-container {
            width: 400px;
            height: 480px;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border-left: 2px solid #000;
        }

        .word-es {
            font-family: 'Roboto Slab', serif;
            font-size: 64px;
            font-weight: 700;
            margin: 0;
            line-height: 1;
        }

        .word-de {
            font-size: 24px;
            color: var(--gray-dark);
            margin-top: 5px;
            font-weight: 400;
        }

        .mnemonic-box {
            background-color: var(--gray-light);
            padding: 20px;
            border-radius: 8px;
            margin: 30px 0;
            font-style: italic;
            font-size: 20px;
            line-height: 1.4;
            border-left: 5px solid #000;
        }

        .example-section {
            margin-top: auto;
        }

        .example-es {
            font-weight: 700;
            font-size: 18px;
            margin-bottom: 5px;
        }

        .example-de {
            font-size: 16px;
            color: var(--gray-dark);
        }

        .footer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 400px;
            background: rgba(255, 255, 255, 0.8);
            padding: 10px 20px;
            font-size: 14px;
            border-top: 1px solid #000;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="image-container">
        <!-- Beispielhaftes Bild laden -->
        <img src="images/processed/001_cantar.png" alt="Mnemonic Image">
        <div class="footer">
            TRMNL Spanish • Vokabel 001/008
        </div>
    </div>
    
    <div class="content-container">
        <div>
            <h1 class="word-es">cantar</h1>
            <div class="word-de">singen</div>
            
            <div class="mnemonic-box">
                "Vogel auf der Dach<strong>KANTE</strong> singt laut"
            </div>
        </div>

        <div class="example-section">
            <div class="example-es">Me gusta cantar bajo la ducha.</div>
            <div class="example-de">Ich singe gerne unter der Dusche.</div>
        </div>
    </div>
</body>
</html>
